[pytest]
DJANGO_SETTINGS_MODULE = configs.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --nomigrations
    --reuse-db
    --tb=short
    --ignore=tests/test_chat_frontend.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
